<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETF Agent 績效</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1c2230; --muted: #6b7385; --line: #e3e6ec;
    --up: #d4343c; --down: #16915a; --accent: #3a63d8; --b1: #e08a00; --b2: #7a3fc9;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --card: #1b1f29; --ink: #e8ebf2; --muted: #9098aa; --line: #2b3140;
      --up: #ff5a5f; --down: #2fc27f; --accent: #7d9bff; --b1: #ffb43a; --b2: #b88bff;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .meta { color: var(--muted); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .label { color: var(--muted); font-size: 12px; }
  .value { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .sub { font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .hero .value { font-size: 30px; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
  section.card { margin-bottom: 16px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--ink); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  button, select { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; }
  button:disabled { color: var(--muted); }
  .tag { display: inline-block; padding: 0 8px; border-radius: 10px; font-size: 12px; border: 1px solid var(--line); }
  .buy { color: var(--up); } .sell { color: var(--down); }
  .empty { color: var(--muted); padding: 12px 0; }
  .error { border-color: var(--up); color: var(--up); }
  svg text { fill: var(--muted); font-size: 11px; }
  code { background: var(--line); padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>虛擬帳戶績效</h1>
    <span class="meta" id="meta">載入中…</span>
    <button id="unit-toggle" type="button"></button>
  </header>
  <div id="notice"></div>
  <div class="grid" id="kpis"></div>
  <section class="card">
    <h2>總資產（NAV）走勢 <button id="chart-mode" type="button" style="margin-left:8px"></button></h2>
    <div id="chart"></div>
  </section>
  <section class="card">
    <h2>與基準比較（同本金、同費稅、官方成交均價買進、官方收盤價估值）</h2>
    <div class="scroll" id="benchmarks"><div class="empty">載入中…</div></div>
  </section>
  <section class="card">
    <h2>買賣紀錄</h2>
    <div class="toolbar" id="trade-bar"></div>
    <div class="scroll" id="trades"></div>
  </section>
  <section class="card" id="pending-card" hidden>
    <h2 id="pending-title">預定買賣</h2>
    <div class="scroll" id="pending"></div>
  </section>
  <section class="card">
    <h2>目前持倉</h2>
    <div class="scroll" id="positions"></div>
  </section>
  <section class="card">
    <h2>每日紀錄</h2>
    <div class="scroll" id="history"></div>
  </section>
</main>
<script>
const nf = new Intl.NumberFormat("zh-TW", { maximumFractionDigits: 0 });
const money = v => v == null ? "—" : nf.format(Number(v));
const signed = v => v == null ? "—" : (Number(v) > 0 ? "+" : "") + nf.format(Number(v));
const pct = v => v == null ? "—" : (Number(v) > 0 ? "+" : "") + (Number(v) * 100).toFixed(2) + "%";
const plain = v => v == null ? "—" : (Number(v) * 100).toFixed(2) + "%";
const tone = v => v == null || Number(v) === 0 ? "flat" : Number(v) > 0 ? "up" : "down";
const time = v => v ? new Date(v).toLocaleString("zh-TW", { hour12: false }) : "—";
const TYPE = { genesis: "開帳", close: "收盤成交", prepared: "收盤估值" };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function tile(label, value, sub, cls = "", subCls = "") {
  return `<div class="card ${cls}"><div class="label">${label}</div>
    <div class="value ${subCls && cls.includes("hero") ? subCls : ""}">${value}</div>
    ${sub ? `<div class="sub ${subCls}">${sub}</div>` : ""}</div>`;
}

let lastPerformance = null, lastBenchmarks = null;
let showAmount = false;
try { showAmount = localStorage.getItem("showAmount") === "1"; } catch (e) {}
const amt = v => v == null || !lastPerformance || lastPerformance.initial_capital == null ? null : Number(v) * Number(lastPerformance.initial_capital);
// 報酬率換成金額：同本金比較時，報酬率 × 起始本金＝損益；沒有金額可換就維持百分比
const ret = (v, amount = amt(v)) => showAmount && amount != null ? signed(amount) + " 元" : pct(v);
const UNIT = () => showAmount ? "元" : "%";
function syncUnitButton() {
  document.getElementById("unit-toggle").textContent = showAmount ? "顯示：金額（點擊改看 %）" : "顯示：%（點擊改看金額）";
}
document.getElementById("unit-toggle").addEventListener("click", () => {
  showAmount = !showAmount;
  try { localStorage.setItem("showAmount", showAmount ? "1" : "0"); } catch (e) {}
  syncUnitButton();
  if (lastPerformance) render(lastPerformance);
  if (lastBenchmarks) renderBenchmarks(lastBenchmarks);
});
syncUnitButton();
const BENCH_COLORS = ["var(--b1)", "var(--b2)"];

function renderChart(history, benchmarks) {
  const el = document.getElementById("chart");
  // 以帳戶與各基準的交易日聯集當 x 軸；基準只畫有估值（nav 非空）的點。
  const series = [{ label: "帳戶", points: history.map(h => [h.trade_date, Number(h.nav)]), dash: "" }];
  (benchmarks || []).forEach((b, i) => {
    if (b.status !== "ok") return;
    series.push({ label: b.label, points: b.series.filter(p => p.nav != null).map(p => [p.trade_date, Number(p.nav)]), dash: "", color: BENCH_COLORS[i % BENCH_COLORS.length] });
  });
  // 差距模式：每條基準線減去同日帳戶 NAV，帳戶變成 0 的基準線，兩條基準才拉得開
  const diff = chartMode === "diff" && series.length > 1;
  if (diff) {
    const acct0 = new Map(series[0].points);
    series.forEach((s, i) => { s.points = s.points.filter(p => acct0.has(p[0])).map(p => [p[0], i === 0 ? 0 : p[1] - acct0.get(p[0])]); });
    series[0].label = "帳戶（0 線）";
  }
  const fmt = v => (diff && v > 0 ? "+" : "") + nf.format(Math.round(v));
  const dates = [...new Set(series.flatMap(s => s.points.map(p => p[0])))].sort();
  if (dates.length < 2) { el.innerHTML = '<div class="empty">至少需要兩個交易日的估值才會出現走勢。</div>'; return; }
  // 依實際寬度畫（不縮放 viewBox），線與字才會清楚
  const W = Math.max(320, Math.round(el.clientWidth || 900)), H = 340, P = { l: 78, r: 70, t: 16, b: 32 };
  const all = series.flatMap(s => s.points.map(p => p[1]));
  let lo = Math.min(...all), hi = Math.max(...all);
  if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
  const x = d => P.l + (W - P.l - P.r) * dates.indexOf(d) / (dates.length - 1);
  const y = v => P.t + (H - P.t - P.b) * (1 - (v - lo) / (hi - lo));
  const base = diff ? 0 : Number(history[0].nav);
  const last = Number(history[history.length - 1].nav);
  const accountColor = last >= Number(history[0].nav) ? "var(--up)" : "var(--down)";
  const ticks = [0, 1, 2, 3, 4].map(i => lo + pad + (hi - lo - 2 * pad) * i / 4).map(v =>
    `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
     <text x="${P.l - 8}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" font-size="12">${fmt(v)}</text>`).join("");
  const step = Math.max(1, Math.ceil(dates.length / Math.max(2, Math.floor((W - P.l - P.r) / 70))));
  const labels = dates.map((d, i) => i % step && i !== dates.length - 1 ? "" :
    `<text x="${x(d).toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="12">${d.slice(5)}</text>`).join("");
  const acct = series[0].points;
  const area = `<path d="M${x(acct[0][0]).toFixed(1)},${y(lo + pad).toFixed(1)} ${acct.map(p => `L${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ")} L${x(acct[acct.length - 1][0]).toFixed(1)},${y(lo + pad).toFixed(1)} Z" fill="${accountColor}" opacity="0.10"/>`;
  const lines = series.map((s, i) => {
    const color = i === 0 ? accountColor : s.color;
    const pts = s.points.map(p => `${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ");
    const dots = i === 0 && s.points.length <= 40 ? s.points.map(p => `<circle cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="3.5" fill="var(--card)" stroke="${color}" stroke-width="2"/>`).join("") : "";
    return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="${i === 0 ? 2.5 : 2.25}" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="${s.dash}"/>${dots}`;
  }).join("");
  const endLabel = series.map((s, i) => {
    const q = s.points[s.points.length - 1];
    return `<text x="${(x(q[0]) + 6).toFixed(1)}" y="${(y(q[1]) + 4).toFixed(1)}" font-size="12" font-weight="600" style="fill:${i === 0 ? accountColor : s.color}">${fmt(q[1])}</text>`;
  }).join("");
  const legend = series.map((s, i) => `<span class="tag"><span style="display:inline-block;width:18px;border-top:3px solid ${i === 0 ? accountColor : s.color};vertical-align:middle;margin-right:4px"></span>${esc(s.label)}</span>`).join(" ");
  el.style.position = "relative";
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="NAV 走勢" style="display:block">
    ${ticks}
    <line x1="${P.l}" x2="${W - P.r}" y1="${y(base).toFixed(1)}" y2="${y(base).toFixed(1)}" stroke="var(--muted)" stroke-dasharray="4 4"/>
    ${area}${lines}${endLabel}${labels}
    <line id="hover-line" y1="${P.t}" y2="${H - P.b}" stroke="var(--muted)" stroke-width="1" style="display:none"/>
    <rect id="hover-area" x="${P.l}" y="${P.t}" width="${W - P.l - P.r}" height="${H - P.t - P.b}" fill="transparent"/>
  </svg><div id="hover-tip" style="display:none;position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.15)"></div><div class="sub">${legend}</div>`;
  const area_ = el.querySelector("#hover-area"), vline = el.querySelector("#hover-line"), tip = el.querySelector("#hover-tip");
  area_.addEventListener("mousemove", ev => {
    const r = el.querySelector("svg").getBoundingClientRect();
    const i = Math.max(0, Math.min(dates.length - 1, Math.round((ev.clientX - r.left - P.l) / (W - P.l - P.r) * (dates.length - 1))));
    const d = dates[i], cx = x(d);
    vline.setAttribute("x1", cx); vline.setAttribute("x2", cx); vline.style.display = "";
    tip.innerHTML = `<b>${d}</b>` + series.map(s => { const q = s.points.find(p => p[0] === d); return q ? `<br>${esc(s.label)}：${fmt(q[1])}` : ""; }).join("");
    tip.style.display = "";
    tip.style.left = Math.min(W - tip.offsetWidth - 4, cx + 12) + "px"; tip.style.top = (P.t + 4) + "px";
  });
  area_.addEventListener("mouseleave", () => { vline.style.display = "none"; tip.style.display = "none"; });
}
let chartMode = "nav";
try { chartMode = localStorage.getItem("chartMode") === "diff" ? "diff" : "nav"; } catch (e) {}
document.getElementById("chart-mode").addEventListener("click", () => {
  chartMode = chartMode === "diff" ? "nav" : "diff";
  try { localStorage.setItem("chartMode", chartMode); } catch (e) {}
  syncChartMode();
  if (lastPerformance && lastPerformance.history) renderChart(lastPerformance.history, lastBenchmarks ? lastBenchmarks.benchmarks : null);
});
function syncChartMode() {
  document.getElementById("chart-mode").textContent = chartMode === "diff" ? "看法：基準減帳戶（點擊改看總資產）" : "看法：總資產（點擊改看基準減帳戶）";
}
syncChartMode();
let chartResizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(chartResizeTimer);
  chartResizeTimer = setTimeout(() => { if (lastPerformance && lastPerformance.history) renderChart(lastPerformance.history, lastBenchmarks ? lastBenchmarks.benchmarks : null); }, 150);
});

function renderBenchmarks(b) {
  const el = document.getElementById("benchmarks");
  if (!b || b.status === "uninitialized") { el.innerHTML = '<div class="empty">尚未開帳，沒有可比較的績效。</div>'; return; }
  if (b.status !== "ok") { el.innerHTML = `<div class="empty">基準比較 unavailable：${esc(b.reason || "原因不明")}</div>`; return; }
  const a = b.account;
  const row = (label, start, latest, nav, cum, excess, mdd, rdd, note) => `<tr><td>${label}</td><td>${start}</td><td>${latest}</td><td>${nav}</td>
    <td class="${tone(cum)}">${ret(cum)}</td><td class="${tone(excess)}">${ret(excess)}</td><td>${plain(mdd)}</td><td>${plain(rdd)}</td><td class="label">${note}</td></tr>`;
  const rows = [row("帳戶", esc(b.account.series[0].trade_date), esc(a.latest_trade_date), money(a.nav), a.cumulative_return, null, a.max_drawdown, null, "")];
  b.benchmarks.forEach(item => {
    if (item.status !== "ok") { rows.push(`<tr><td>${esc(item.label)}</td><td colspan="8" class="label">unavailable：${esc(item.reason)}</td></tr>`); return; }
    const c = item.comparison || {}, l = item.latest || {};
    const note = c.status === "ok" ? `超額報酬與相對回撤以 ${esc(c.trade_date)} 對齊（${c.aligned_days} 點）；起始日成交 ${item.execution && item.execution.price ? esc(item.execution.price) + " 元" : esc(String(item.execution ? item.execution.fills : "")) + " 筆"}，手續費 ${money(item.commission)} 元` : `超額報酬 unavailable：${esc(c.reason || "")}`;
    rows.push(row(esc(item.label), esc(item.start_date || "—"), esc(l.trade_date || "—"), money(l.nav), l.cumulative_return, c.excess_return, item.max_drawdown, c.relative_drawdown, note));
  });
  el.innerHTML = `<table>
    <tr><th>項目</th><th>起始日</th><th>最新交易日</th><th>NAV</th><th>累積報酬（${UNIT()}）</th><th>超額報酬（帳戶−基準，${UNIT()}）</th><th>最大回撤</th><th>相對回撤</th><th>說明</th></tr>
    ${rows.join("")}
  </table><div class="sub">as-of ${time(b.as_of)}；起始日 ${esc(b.start_date || "—")}；費稅 手續費率 ${esc(b.fees.commission_rate)}、最低 ${esc(b.fees.minimum_commission)} 元、賣出稅率 ${esc(b.fees.sell_tax_rate)}；${esc(b.method.valuation)}。</div>`;
}

let selectedDate = null;
const SIDE = { buy: "買進", sell: "賣出" };

function renderTrades(d) {
  const days = d.history.map(h => h.trade_date).filter((v, i, a) => a.indexOf(v) === i).filter(v => v).reverse();
  if (!selectedDate || !days.includes(selectedDate)) selectedDate = (d.trades.length ? d.trades[d.trades.length - 1].trade_date : days[0]);
  const i = days.indexOf(selectedDate);
  const bar = document.getElementById("trade-bar");
  bar.innerHTML = `<button id="newer" ${i <= 0 ? "disabled" : ""}>◀ 較新</button>
    <select id="day">${days.map(v => `<option value="${esc(v)}" ${v === selectedDate ? "selected" : ""}>${esc(v)}${d.trades.some(t => t.trade_date === v) ? "" : "（無成交）"}</option>`).join("")}</select>
    <button id="older" ${i >= days.length - 1 ? "disabled" : ""}>較舊 ▶</button>`;
  const go = v => { selectedDate = v; renderTrades(d); };
  document.getElementById("day").onchange = e => go(e.target.value);
  document.getElementById("newer").onclick = () => go(days[i - 1]);
  document.getElementById("older").onclick = () => go(days[i + 1]);
  const day = d.trades.find(t => t.trade_date === selectedDate);
  document.getElementById("trades").innerHTML = day ? `<table>
    <tr><th>方向</th><th>代號</th><th>張數</th><th>成交價</th><th>成交金額</th><th>手續費</th><th>證交稅</th><th>已實現損益</th></tr>
    ${day.fills.map(f => `<tr><td><span class="tag ${f.side}">${SIDE[f.side] || esc(f.side)}</span></td><td>${esc(f.symbol)}</td><td>${nf.format(f.lots)}</td>
      <td>${f.price == null ? "—" : Number(f.price).toFixed(2)}</td><td>${money(f.gross_amount)}</td><td>${money(f.commission)}</td><td>${money(f.tax)}</td>
      <td class="${tone(f.realized_pnl)}">${f.side === "sell" ? signed(f.realized_pnl) : "—"}</td></tr>`).join("")}
  </table><div class="sub">這天已實現損益合計 <span class="${tone(day.realized_pnl)}">${signed(day.realized_pnl)}</span> 元</div>`
    : `<div class="empty">${esc(selectedDate)} 沒有買賣成交。</div>`;
  const pend = d.pending_orders, card = document.getElementById("pending-card");
  card.hidden = !pend;
  if (pend) document.getElementById("pending-title").textContent = pend.execution_date ? `預定買賣（${pend.execution_date} 收盤成交）` : "預定買賣（下一個交易日收盤成交）";
  if (pend) document.getElementById("pending").innerHTML = pend.orders.length ? `<table>
    <tr><th>方向</th><th>代號</th><th>意圖</th><th>張數</th><th>占資金</th></tr>
    ${pend.orders.map(o => `<tr><td><span class="tag ${o.side}">${SIDE[o.side] || esc(o.side)}</span></td><td>${esc(o.symbol)}</td><td>${esc(o.intent || "—")}</td><td>${nf.format(o.lots)}</td><td>${o.weight == null ? "—" : (Number(o.weight) * 100).toFixed(2) + "%"}</td></tr>`).join("")}
  </table><div class="sub">已決定，以收盤價成交，成交後會移到上面的買賣紀錄；決策 ${esc(pend.decision_run_id)}（${esc(pend.status)}）。${pend.decided_at ? `這是最終版：${esc(pend.decided_at.slice(5, 16).replace("T", " "))} 做的` : "這是最終版"}${pend.version_count ? `，這個交易日共 ${pend.version_count} 版，舊版在 versions/${esc(pend.execution_date)}/` : ""}。</div>`
    : '<div class="empty">最新決策沒有委託。</div>';
}

// 持倉表：點欄位標題排序（再點一次反向、第三次回原順序）；空值一律排最後
const POSITION_COLUMNS = [
  ["symbol", "代號", false], ["lots", "張數", true], ["average_cost", "均價", true], ["price", "現價", true],
  ["cost_value", "成本", true], ["market_value", "市值", true], ["weight", "權重", true], ["unrealized_pnl", "未實現損益", true],
  ["unrealized_return", null, true],
];
let positionSort = { key: null, dir: -1 };
function renderPositions(d) {
  const el = document.getElementById("positions");
  if (!d.positions.length) { el.innerHTML = '<div class="empty">目前空倉。</div>'; return; }
  const key = positionSort.key, dir = positionSort.dir;
  const rows = d.positions.slice();
  if (key) {
    const num = key !== "symbol";
    rows.sort((a, b) => {
      const x = a[key], y = b[key];
      if (x == null && y == null) return 0;
      if (x == null) return 1;
      if (y == null) return -1;
      return dir * (num ? Number(x) - Number(y) : String(x).localeCompare(String(y)));
    });
  }
  const head = POSITION_COLUMNS.map(([k, label]) => {
    const text = label || `報酬（${UNIT()}）`;
    const mark = key === k ? (dir < 0 ? " ▼" : " ▲") : "";
    return `<th class="sortable" data-sort="${k}">${text}${mark}</th>`;
  }).join("");
  el.innerHTML = `<table>
    <tr>${head}</tr>
    ${rows.map(p => `<tr><td>${esc(p.symbol)}</td><td>${nf.format(p.lots)}</td>
      <td>${Number(p.average_cost).toFixed(2)}</td><td>${p.price == null ? "—" : Number(p.price).toFixed(2)}</td>
      <td>${money(p.cost_value)}</td><td>${money(p.market_value)}</td><td>${plain(p.weight)}</td>
      <td class="${tone(p.unrealized_pnl)}">${signed(p.unrealized_pnl)}</td>
      <td class="${tone(p.unrealized_return)}">${ret(p.unrealized_return, p.unrealized_pnl)}</td></tr>`).join("")}
  </table>`;
}
document.getElementById("positions").addEventListener("click", ev => {
  const th = ev.target.closest("th[data-sort]");
  if (!th || !lastPerformance) return;
  const k = th.dataset.sort;
  if (positionSort.key !== k) positionSort = { key: k, dir: -1 };
  else if (positionSort.dir < 0) positionSort.dir = 1;
  else positionSort = { key: null, dir: -1 };
  renderPositions(lastPerformance);
});

function render(d) {
  document.getElementById("meta").textContent =
    `帳戶 ${d.account_id}・資料時間 ${time(d.as_of)}・狀態 ${d.latest_state_type}・${new Date().toLocaleTimeString("zh-TW", { hour12: false })} 更新`;
  const t = d.today;
  document.getElementById("kpis").innerHTML = [
    tile(t ? `今日報酬率・帳面（${t.trade_date}）` : "今日報酬率・帳面", t ? ret(t.return, t.pnl) : "—", t ? `帳面損益 ${signed(t.pnl)} 元（持股漲跌，尚未賣出）` : "開帳後尚無收盤估值", "hero", t ? tone(t.return) : ""),
    tile("累積已實現損益（已賣出）", signed(d.realized_pnl), "只算已賣出的部分，已扣手續費與證交稅", "hero", tone(d.realized_pnl)),
    tile("累積報酬（含帳面）", ret(d.total_return, d.total_pnl), `累積損益 ${signed(d.total_pnl)} 元＝已實現＋持股未實現`, "", tone(d.total_return)),
    tile("目前總資產（NAV）", money(d.nav), `起始本金 ${money(d.initial_capital)} 元`),
    tile("現金", money(d.cash), `現金比 ${plain(d.cash_weight)}・未交割 ${money(d.unsettled_cash)}`),
    tile("持股市值", money(d.market_value), `${d.positions.length} 檔持股`),
    tile("累計費稅", money(Number(d.fees.commission) + Number(d.fees.tax)), `手續費 ${money(d.fees.commission)}・證交稅 ${money(d.fees.tax)}・${d.fees.fill_count} 筆成交`),
  ].join("");
  lastPerformance = d;
  renderChart(d.history, lastBenchmarks ? lastBenchmarks.benchmarks : null);
  renderTrades(d);
  renderPositions(d);
  document.getElementById("history").innerHTML = `<table>
    <tr><th>交易日</th><th>類型</th><th>NAV</th><th>當日帳面損益</th><th>當日報酬（帳面，${UNIT()}）</th><th>累積報酬（${UNIT()}）</th></tr>
    ${d.history.slice().reverse().map(h => `<tr><td>${esc(h.trade_date)}</td><td>${TYPE[h.type] || esc(h.type)}</td>
      <td>${money(h.nav)}</td><td class="${tone(h.daily_pnl)}">${signed(h.daily_pnl)}</td>
      <td class="${tone(h.daily_return)}">${ret(h.daily_return, h.daily_pnl)}</td>
      <td class="${tone(h.cumulative_return)}">${ret(h.cumulative_return)}</td></tr>`).join("")}
  </table>`;
}

async function load() {
  const notice = document.getElementById("notice");
  try {
    const res = await fetch("/api/performance", { cache: "no-store" });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || res.statusText);
    if (body.status === "uninitialized") {
      notice.innerHTML = `<div class="card">帳戶 <b>${esc(body.account_id)}</b> 尚未開帳。請先執行
        <code>PYTHONPATH=src python3 cli/virtual_account.py --account-id ${esc(body.account_id)} init --started-at ISO_TIME</code></div>`;
      document.getElementById("meta").textContent = "尚未開帳";
      return;
    }
    notice.innerHTML = "";
    render(body);
  } catch (error) {
    notice.innerHTML = `<div class="card error">無法讀取帳本：${esc(error.message)}</div>`;
  }
}

async function loadBenchmarks() {
  const el = document.getElementById("benchmarks");
  try {
    const res = await fetch("/api/benchmarks", { cache: "no-store" });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || res.statusText);
    lastBenchmarks = body.status === "ok" ? body : null;
    renderBenchmarks(body);
    if (lastPerformance && lastPerformance.history) renderChart(lastPerformance.history, lastBenchmarks ? lastBenchmarks.benchmarks : null);
  } catch (error) {
    lastBenchmarks = null;
    el.innerHTML = `<div class="empty">基準比較無法讀取：${esc(error.message)}</div>`;
  }
}
load().then(loadBenchmarks);
setInterval(() => load().then(loadBenchmarks), 60000);
</script>
</body>
</html>
